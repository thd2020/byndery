[package]
name = "byndery"
version = "0.0.2"
description = "A terminal, file tree and editor in one window, built to sit beside terminal coding agents."
authors = ["thd2020"]
license = "MIT"
repository = "https://github.com/thd2020/byndery"
edition = "2021"
rust-version = "1.80"

[lib]
name = "byndery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
zstd = "0.13"
tar = "0.4"
trash = "5"
gethostname = "1"
encoding_rs = "0.8"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
