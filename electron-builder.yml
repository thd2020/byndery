appId: com.holarky.byndery
productName: byndery
asar: true
asarUnpack:
  - "**/*.node"
directories:
  output: dist
files:
  - out/**
  - node_modules/**
  - package.json
  - README.assets/byndery-icon.png
extraResources:
  - from: resources/shell
    to: shell
    filter:
      - "**/*"
  - from: vendor
    to: vendor
    filter:
      - "**/*"
      - "!**/.cache/**"
      - "!**/.git/**"
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE
win:
  icon: packaging/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: byndery-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: packaging/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: byndery-${version}-${os}-${arch}.${ext}
linux:
  icon: README.assets/byndery-icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  artifactName: byndery-${version}-${os}-${arch}.${ext}
