<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: byndery-file:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <title>byndery</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="titlebar">
      <button id="ws-button" class="tb-item" title="Open folder (Ctrl+O)">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.6 3.5 6.2 20.5h2.7L11.3 3.5z" fill="var(--logo-stem)" />
          <path d="M10.6 11.2c1.2-1.4 3-2.2 4.8-2 2.4.3 4.1 2.5 3.7 5-.4 2.6-2.8 4.6-5.5 4.4l-1.6-.2.4-2.4 1.5.2c1.5.1 2.7-.9 2.9-2.3.2-1.3-.7-2.4-1.9-2.6-1-.1-2 .3-2.7 1z" fill="none" stroke="var(--accent)" stroke-width="1.4" />
        </svg>
        <span id="ws-name"></span>
      </button>
      <span id="branch" class="tb-meta" hidden></span>
      <button id="search-button" class="tb-search" title="Go to file (Ctrl+P)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" /><path d="m10.2 10.2 3.3 3.3" /></svg>
        <span>Go to file</span>
        <kbd>Ctrl P</kbd>
      </button>
    </header>

    <main id="layout">
      <aside id="sidebar">
        <div class="pane-head" id="tree-head">
          <button id="tree-up" class="icon-btn" title="Parent folder (Alt+Up)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5v-9" /><path d="M4.5 7 8 3.5 11.5 7" /></svg>
          </button>
          <nav id="tree-path" class="crumbs" aria-label="Folder"></nav>
          <button id="follow-button" class="icon-btn" title="Sync with terminal" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 7A5.2 5.2 0 0 1 12 4.3" /><path d="M12.6 1.9v2.7H9.9" /><path d="M13.2 9A5.2 5.2 0 0 1 4 11.7" /><path d="M3.4 14.1v-2.7h2.7" /></svg>
          </button>
          <button id="collapse-button" class="icon-btn" title="Collapse folders">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 9.5 8 6l4 3.5" /></svg>
          </button>
        </div>
        <div id="tree" tabindex="0" role="tree" aria-label="Files"></div>
      </aside>
      <div class="sash" data-sash="sidebar"></div>

      <section id="terminals">
        <div class="pane-head" id="term-tabs">
          <div class="tabs"></div>
          <button id="new-term" class="icon-btn" title="New terminal (Ctrl+T)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
          </button>
          <button id="new-term-menu" class="icon-btn" title="Profiles">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>
          </button>
        </div>
        <div id="term-host"></div>
      </section>
      <div class="sash" data-sash="editor"></div>

      <section id="editor" hidden>
        <div class="pane-head" id="editor-tabs">
          <div class="tabs"></div>
          <button id="md-toggle" class="text-btn" title="Toggle Markdown source (Ctrl+E)" hidden>Source</button>
        </div>
        <div id="editor-notice" hidden></div>
        <div id="editor-host"></div>
        <div id="editor-empty" hidden></div>
      </section>
    </main>

    <div id="palette" hidden>
      <input id="palette-input" spellcheck="false" autocomplete="off" />
      <ul id="palette-list" role="listbox"></ul>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
