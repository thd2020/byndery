# Builds the installers on native runners for all six platform and architecture
# pairs. Called by ci.yml (pull requests: build and keep the files as workflow
# artifacts) and by release.yml (upload to a GitHub Release when `tag` is set).
# Permissions come from the caller: release.yml grants contents, id-token and
# attestations write; ci.yml grants read and pull-requests write.
name: package

on:
  workflow_call:
    inputs:
      tag:
        description: Release to upload the installers to; empty keeps them as workflow artifacts
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
            rust: x86_64-pc-windows-msvc
            attest: dist/*.exe
          - runner: windows-11-arm
            label: windows-arm64
            rust: aarch64-pc-windows-msvc
            attest: dist/*.exe
          - runner: macos-15-intel
            label: macos-x64
            rust: x86_64-apple-darwin
            attest: dist/*.dmg
          - runner: macos-latest
            label: macos-arm64
            rust: aarch64-apple-darwin
            attest: dist/*.dmg
          - runner: ubuntu-22.04
            label: linux-x64
            rust: x86_64-unknown-linux-gnu
            attest: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
          - runner: ubuntu-22.04-arm
            label: linux-arm64
            rust: aarch64-unknown-linux-gnu
            attest: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
    env:
      # linuxdeploy (AppImage) runs without FUSE and leaves libraries unstripped.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" "https://static.rust-lang.org/rustup/dist/${{ matrix.rust }}/rustup-init.exe"
              "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.rust }} --no-self-update
          rustup default stable
          rustc --version
      - name: Install Linux packaging tools and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file rpm squashfs-tools
      - name: Cache Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ matrix.label }}-
      # One step, so a failure leaves one log for the pull request comment below.
      - name: Install, prepare resources, build and package
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm run package
          } 2>&1 | tee "$RUNNER_TEMP/package.log"
      - name: Check the Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          {
            release=src-tauri/target/release
            test -f "$release/handoff/byndery-handoff.exe" || { echo "::error::byndery-handoff.exe was not bundled"; exit 1; }
            "$release/handoff/byndery-handoff.exe" --status
            if [ -f "$release/vendor/msys64.tar.zst" ]; then
              # The installer's first step: unpack byndery's Linux tools, then use them.
              "$release/byndery.exe" --seed-msys
              msys="$LOCALAPPDATA/com.holarky.byndery/msys64"
              test -f "$msys/usr/bin/zsh.exe" || { echo "::error::--seed-msys did not unpack MSYS2"; exit 1; }
              MSYSTEM=UCRT64 "$msys/usr/bin/zsh.exe" -lc 'echo zsh $ZSH_VERSION; git --version; git init -q /tmp/t && git -C /tmp/t status --short && git clone -q /tmp/t /tmp/t2 && echo clone ok; command -v pacman zstd'
              ls "$msys/usr/bin" | grep -c '^git-.*\.exe$' | sed 's/^/git-*.exe left: /'
              du -sh "$msys" "$release/vendor/msys64.tar.zst"
            fi
            ls -la dist
          } 2>&1 | tee -a "$RUNNER_TEMP/package.log"
      - name: Write SHA-256 files and upload installers
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $files = node scripts/write-checksums.mjs | ConvertFrom-Json
          gh release upload $env:TAG $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload to $env:TAG failed" }
      - name: Attest installers
        if: inputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ matrix.attest }}
      - name: Keep the installers for testing
        if: inputs.tag == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byndery-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7
          if-no-files-found: error
      # Job logs need a sign-in to read; the end of the log on the pull request does not.
      - name: Post the end of the log to the pull request
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### ${{ matrix.label }} packaging failed"
            echo
            echo '```'
            grep -v -E '^\s*(Compiling|Downloaded|Downloading) ' "$RUNNER_TEMP/package.log" 2>/dev/null | tail -n 80 | cut -c1-300 || echo "(no log)"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"
