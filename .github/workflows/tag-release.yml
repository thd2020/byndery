# Tags v<version> when package.json on main carries a version that has no tag
# yet, then starts release.yml for that tag. A tag pushed with GITHUB_TOKEN does
# not trigger other workflows, but a workflow_dispatch does, so the release runs
# through its attach_tag input. Pushing a v* tag by hand still works.
#
# Committing a change to .github/release-request.json on main rebuilds an
# existing release from main and replaces its files, then publishes it if it
# is still a draft:
#   {"tag": "v0.0.1", "reason": "..."}
name: tag-release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/tag-release.yml
      - .github/release-request.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the package version and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists; nothing to do."
            exit 0
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG" -f attach_tag="$TAG"
          echo "::notice::Tagged $TAG and started the release workflow."

  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rebuild the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          FILE=.github/release-request.json
          if [ ! -f "$FILE" ] || ! git diff --name-only "$BEFORE" HEAD 2>/dev/null | grep -qx "$FILE"; then
            echo "::notice::No new release request; nothing to rebuild."
            exit 0
          fi
          TAG="$(node -p "require('./$FILE').tag")"
          if ! git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG does not exist; a request only rebuilds an existing release."
            exit 1
          fi
          gh workflow run release.yml --ref main -f attach_tag="$TAG"
          echo "::notice::Started release.yml for $TAG from main."
