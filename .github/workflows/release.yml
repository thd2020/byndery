name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      attach_tag:
        description: Existing release tag to build or rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.attach_tag || github.ref }}
      - name: Create a draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACH_TAG: ${{ inputs.attach_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${ATTACH_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --json isDraft -q .isDraft >/dev/null 2>&1; then
            DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft)"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            DRAFT=true
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: --win --x64
            label: windows-x64
            attest: dist/*.exe
          - runner: windows-11-arm
            target: --win --arm64
            label: windows-arm64
            attest: dist/*.exe
          - runner: macos-15-intel
            target: --mac --x64
            label: macos-x64
            attest: dist/*.dmg
          - runner: macos-latest
            target: --mac --arm64
            label: macos-arm64
            attest: dist/*.dmg
          - runner: ubuntu-22.04
            target: --linux --x64
            label: linux-x64
            attest: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
          - runner: ubuntu-22.04-arm
            target: --linux --arm64
            label: linux-arm64
            attest: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libatspi2.0-dev libglib2.0-dev libwayland-dev fakeroot dpkg rpm squashfs-tools
      - name: Install dependencies
        run: npm ci
      - name: Prepare icons and bundled resources
        run: npm run package:assets
      - name: Build the app
        run: npm run build
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Write SHA-256 files and upload installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $files = node scripts/write-checksums.mjs | ConvertFrom-Json
          gh release upload $env:TAG $files --clobber
      - name: Attest installers
        uses: actions/attest@1e69f48acb82b1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ matrix.attest }}

  publish-release:
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
