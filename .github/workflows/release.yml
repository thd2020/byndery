# Builds the six installers and publishes them as a GitHub Release.
#
# A pushed v* tag builds that tag. tag-release.yml starts this workflow for a
# new package.json version (built from the tag) or for a rebuild request
# (built from main). workflow_dispatch builds the chosen ref and attaches the
# files to `attach_tag`, replacing files with the same names.
#
# The release stays a draft until every build has uploaded, so the updater
# (releases/latest) never sees a release with missing installers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      attach_tag:
        description: Existing release tag to build or rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.attach_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Create a draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTACH_TAG: ${{ inputs.attach_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${ATTACH_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The releases list includes drafts, which the tag lookup does not.
          DRAFT="$(gh api "repos/$GH_REPO/releases" --paginate -q ".[] | select(.tag_name == \"$TAG\") | .draft" | head -n1)"
          if [ -z "$DRAFT" ]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            DRAFT=true
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag }}

  publish-release:
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GH_REPO/releases" --paginate -q ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)"
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false -f make_latest=true >/dev/null
          echo "::notice::Published $TAG."
